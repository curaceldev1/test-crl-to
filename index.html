<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Deployment - crl.to</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 1rem;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .status {
            display: inline-block;
            background: #4ade80;
            color: #064e3b;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: bold;
            margin-top: 1rem;
        }
        .info {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .timestamp {
            font-family: monospace;
            background: rgba(0,0,0,0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Deployment Test</h1>
        <div class="card">
            <h2>test.crl.to</h2>
            <p>This page confirms the deployment pipeline is working correctly.</p>
            <span class="status">✅ Live</span>
            <div class="info">
                <p>Deployed: <span class="timestamp" id="timestamp"></span></p>
                <p>Agent: TS (Theus)</p>
                <p>Domain: crl.to</p>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('timestamp').textContent = new Date().toISOString();
    </script>
</body>
</html>
